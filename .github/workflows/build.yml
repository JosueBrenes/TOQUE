name: Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build every mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The wrapper pins the Gradle version, so nothing here chooses one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload server mod
        uses: actions/upload-artifact@v4
        with:
          name: toque-death-alert
          path: mods/death-alert/build/libs/toque-death-alert-*[0-9].jar

      - name: Upload banner mod
        uses: actions/upload-artifact@v4
        with:
          name: toque-server-banner
          path: mods/server-banner/build/libs/toque-server-banner-*[0-9].jar

      - name: Upload mob spawner mod
        uses: actions/upload-artifact@v4
        with:
          name: toque-mob-spawner
          path: mods/mob-spawner/build/libs/toque-mob-spawner-*[0-9].jar
