plugins {
    // Resolved here so every module inherits one version of Loom.
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    }

    processResources {
        inputs.property "version", project.version
        filesMatching("fabric.mod.json") {
            expand "version": project.version
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = Integer.parseInt(rootProject.java_version)
        // The source carries characters such as the skull and the accented
        // Spanish text. Java 18 and later default to UTF-8, but saying so keeps
        // the build correct on an older toolchain and off the platform default.
        it.options.encoding = 'UTF-8'
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.toVersion(rootProject.java_version)
        targetCompatibility = JavaVersion.toVersion(rootProject.java_version)
    }
}
